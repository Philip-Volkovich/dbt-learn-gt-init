sources:
  - name: jaffle_shop
    description: A clone of a Postgres DB
    database: raw 
    schema: jaffle_shop
    tables:
      - name: customers
        description: Raw customerts data
        columns:
        - name: id
          description: the primary key
          data_tests:
            - unique 
            - not_null

      - name: orders
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 1
              period: day          
          loaded_at_field: _etl_loaded_at